name: laya-terminal-pong

services:
  laya-server:
    build: ./laya-server
    image: laya-terminal-pong/server
    # host network = zero overhead de NAT (o jogo fala em 127.0.0.1:8000)
    network_mode: host
    environment:
      # cpu (default) | cuda
      LAYA_DEVICE: ${LAYA_DEVICE:-cpu}
      # multilingual (default) | english | typed-decisions
      LAYA_MODEL: ${LAYA_MODEL:-multilingual}
      # int8 só se aplica a CPU
      LAYA_INT8: ${LAYA_INT8:-1}
    volumes:
      # cache dos checkpoints fora do container (não baixa a cada rebuild)
      - hf-cache:/root/.cache/huggingface
    # GPU (NVIDIA Container Toolkit): descomente e rode com LAYA_DEVICE=cuda
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    restart: unless-stopped

volumes:
  hf-cache:
